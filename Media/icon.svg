<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Bronze ring; matches HeyListen for in-house consistency -->
    <linearGradient id="bronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#5e3f1a"/>
      <stop offset="20%"  stop-color="#a37428"/>
      <stop offset="42%"  stop-color="#f4d27a"/>
      <stop offset="55%"  stop-color="#fff1b8"/>
      <stop offset="68%"  stop-color="#d8a64a"/>
      <stop offset="100%" stop-color="#3a2510"/>
    </linearGradient>

    <!-- Inner disc: dark crimson to signal "muted / blocked" -->
    <radialGradient id="discBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%"  stop-color="#4a1418"/>
      <stop offset="55%" stop-color="#2a0a0c"/>
      <stop offset="100%" stop-color="#0c0306"/>
    </radialGradient>

    <radialGradient id="warnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff6a4a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#a02418" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Speech bubble fill: parchment/bone -->
    <linearGradient id="bubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f6f6f0"/>
      <stop offset="100%" stop-color="#a8a89e"/>
    </linearGradient>

    <!-- Diagonal "no" slash -->
    <linearGradient id="slash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6a55"/>
      <stop offset="100%" stop-color="#9a181c"/>
    </linearGradient>

    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer bronze ring -->
  <circle cx="128" cy="128" r="124" fill="url(#bronze)"/>

  <!-- Inner crimson disc + soft warn glow -->
  <circle cx="128" cy="128" r="108" fill="url(#discBg)"/>
  <circle cx="128" cy="128" r="108" fill="url(#warnGlow)"/>

  <!-- Speech bubble (rounded rect with tail bottom-left) -->
  <g filter="url(#bubbleShadow)">
    <path d="M 70 78
             Q 70 62 86 62
             L 170 62
             Q 186 62 186 78
             L 186 142
             Q 186 158 170 158
             L 116 158
             L 92 184
             L 98 158
             L 86 158
             Q 70 158 70 142
             Z"
          fill="url(#bubble)" stroke="#1a1612" stroke-width="3"/>
    <!-- Three "..." dots inside (chat) -->
    <circle cx="100" cy="111" r="8" fill="#3a3a36"/>
    <circle cx="128" cy="111" r="8" fill="#3a3a36"/>
    <circle cx="156" cy="111" r="8" fill="#3a3a36"/>
  </g>

  <!-- Diagonal "no" slash on top: dark base + glowing red overlay -->
  <line x1="54" y1="202" x2="202" y2="54" stroke="#1a0608" stroke-width="24" stroke-linecap="round"/>
  <line x1="54" y1="202" x2="202" y2="54" stroke="url(#slash)" stroke-width="14" stroke-linecap="round"/>
</svg>
